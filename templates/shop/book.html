{% extends 'shop/base.html' %}

{% block content %}

<section class="page-header">
    <h1>Book Appointment</h1>
    <p>Reserve your spot today.</p>
</section>

<div class="container py-5">
    <div class="booking-card">
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-gold w-100">
                Book Now
            </button>
        </form>
    </div>
</div>

{% endblock %}
